<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="RiftLedger Data Desk — automated analysis, not a person">
<title>RiftLedger Data Desk — an automated byline, not a person</title>
<defs>
<linearGradient id="dd" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#12897a"/>
<stop offset="1" stop-color="#14111a"/>
</linearGradient>
<clipPath id="ddc"><circle cx="48" cy="48" r="48"/></clipPath>
</defs>
<g clip-path="url(#ddc)">
<rect width="96" height="96" fill="url(#dd)"/>
<!-- Deliberately a chart, not a face: the personas get abstract marks, and this
     byline gets a glyph that reads as "a script produced this". -->
<path d="M18 66 L36 48 L48 57 L78 27" fill="none" stroke="#38d6c3" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 27 H78 V45" fill="none" stroke="#38d6c3" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="74" width="64" height="4" rx="2" fill="#38d6c3" opacity="0.35"/>
</g>
</svg>
